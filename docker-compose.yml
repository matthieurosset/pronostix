services:
  pronostix:
    build: .
    image: pronostix:latest
    container_name: pronostix
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Compte admin (re)créé à chaque boot. Change le PIN avant de déployer.
      ADMIN_PSEUDO: Matthieu
      ADMIN_PIN: "2026"
      # How often (minutes) the auto-fetcher polls for final results. 0 = disabled.
      FETCH_INTERVAL_MIN: "3"
      TZ: Europe/Zurich
    volumes:
      - pronostix-data:/data

volumes:
  pronostix-data:
